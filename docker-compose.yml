# Production stack. Every host-specific value comes from .env (gitignored, see .env.example).
services:
  tata:
    build:
      context: .
      target: runtime
    container_name: tata
    restart: unless-stopped   # also what brings uvicorn back after a certificate renewal
    init: true
    hostname: tata
    user: "${TATA_UID}:${TATA_GID}"   # host owner of the data and acme dirs: no chown needed
    environment:
      - TATA_USER
      - TATA_PASSWORD
      - TATA_RIMBORSO_KM
      - TATA_RIMBORSO_EURO_KM
      - TATA_HA_URL
      - TATA_HA_TOKEN
      - TATA_DOMAIN
      - CF_Token
      - CF_Zone_ID
    volumes:
      - ${TATA_DATA}:/data
      - ${TATA_ACME}:/acme
    networks:
      lan:
        ipv4_address: ${TATA_IP}

networks:
  lan:
    name: ${TATA_NETWORK}
    external: true
